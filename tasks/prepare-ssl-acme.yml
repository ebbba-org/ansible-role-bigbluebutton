---
# NOTE: Included by prepare-ssl.yml

- name: Disable ACME
  when: not bbb_acme_enable
  become: true
  ansible.builtin.cron:
    name: "ACME cron"
    state: absent

- name: Enable ACME
  when: bbb_acme_enable
  block:
    - name: Ensure nginx is installed
      become: true
      ansible.builtin.package:
        name: nginx
        state: present

    - name: Ensure nginx is running
      become: true
      ansible.builtin.systemd:
        name: nginx
        state: started

    - name: Wait for port 80 to be reachable
      ansible.builtin.wait_for:
        host: "{{ bbb_hostname }}"
        port: 80
        timeout: 30
        msg: "Nginx failed to start up or is not configured to listen to port 80"

    - name: Ensure acme.sh directories exist
      become: true
      file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /var/bigbluebutton/acme
        - /var/bigbluebutton/acme/.download

    - name: Check if we need to download acme.sh
      become: true
      stat:
        path: /var/bigbluebutton/acme/.download/acme.sh
      register: stat_result
      when: not bbb_acmesh_update

    - name: Download or update acme.sh
      become: true
      ansible.builtin.get_url:
        url: "{{ bbb_acmesh_download }}"
        dest: /var/bigbluebutton/acme/.download/acme.sh
        mode: "0755"
      when: bbb_acmesh_update or not (stat_result.stat.exists | default(False))

    - name: Install acme.sh and register an account
      become: true
      ansible.builtin.command:
        chdir: /var/bigbluebutton/acme/.download
        cmd: >-
          ./acme.sh --install
          --home /var/bigbluebutton/acme/
          --accountemail {{ bbb_acme_email }}
          --server {{ bbb_acme_api }}
          --no-cron
          --no-profile
      register: acme_install_result
      changed_when: "'ok' in acme_install_result.stdout"

    - name: Issue certificate with acme.sh
      become: true
      ansible.builtin.command:
        chdir: /var/bigbluebutton/acme
        cmd: >-
          ./acme.sh --issue
          --home /var/bigbluebutton/acme/
          --server {{ bbb_acme_api }}
          --domain {{ bbb_hostname }}
          --webroot /var/www/html/
          --reloadcmd "systemctl reload nginx.service haproxy.service || true"
          --key-file {{ bbb_ssl_key }}
          --fullchain-file {{ bbb_ssl_cert }}
          --keylength ec-256
      register: result
      changed_when: "'new certificate' in result.stdout"
      failed_when: result.rc not in [ 0, 2 ]

    # When re-installing with a persistet acme folder, the cert may not
    # be renewed and thus not installed, so we do that here explicitly. 
    - name: Ensure ssl files are properly installed
      become: true
      ansible.builtin.command:
        chdir: /var/bigbluebutton/acme
        cmd: >-
          ./acme.sh --install-cert
          --home /var/bigbluebutton/acme/
          --domain {{ bbb_hostname }}
          --reloadcmd "systemctl reload nginx.service haproxy.service || true"
          --key-file {{ bbb_ssl_key }}
          --fullchain-file {{ bbb_ssl_cert }}
        creates: "{{ bbb_ssl_cert }}"

    - name: Install ACME cron
      become: true
      ansible.builtin.cron:
        name: "ACME cron"
        hour: "4"
        minute: "13"
        job: "/var/bigbluebutton/acme/acme.sh --cron --home /var/bigbluebutton/acme"
