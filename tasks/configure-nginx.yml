---
- name: Deploy nginx site configs
  become: true
  ansible.builtin.template:
    src: "bbb-config/nginx/sites-available/{{ item }}.j2"
    dest: "/etc/nginx/sites-available/{{ item }}"
    mode: "644"
  loop:
    - default
    - bigbluebutton
  notify: Reload nginx

- name: Enable nginx sites
  become: true
  ansible.builtin.file:
    src: "/etc/nginx/sites-available/{{ item }}"
    dest: "/etc/nginx/sites-enabled/{{ item }}"
    state: link
    mode: "644"
  loop:
    - default
    - bigbluebutton
  notify: Reload nginx

# https://github.com/bigbluebutton/bigbluebutton/commit/8da1a2c43b7aa077ab921f6321b633726c6e7f65
- name: Remove legacy sip.js if present
  become: true
  ansible.builtin.file:
    path: /usr/share/bigbluebutton/nginx/sip.nginx
    state: absent
  notify: Reload nginx
